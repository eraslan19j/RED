name: Dragon Realms - Android APK Derleme

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_SHORT: "4.7.2.stable"
  APK_NAME: "DRAGON_REALMS.apk"
  ARTIFACT_NAME: "DRAGON_REALMS_ANDROID_APK"

jobs:
  build-android:
    name: Godot 4.7.2 -> Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: JDK 17 kurulumu (Godot Android derlemesi için)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK komut satırı araçları
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0"

      - name: Godot 4.7.2 indir (headless modda çalıştırılacak)
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          ln -sf "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --headless --version

      - name: Export template'leri kur
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_SHORT}"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d "$HOME/.local/share/godot/export_templates/${GODOT_SHORT}"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_SHORT}" | head

      - name: Debug imzalama anahtarı oluştur (yalnızca debug, gizli değil)
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Proje asset'lerini içe aktar
        run: godot --headless --path . --import

      - name: Otomatik testleri çalıştır
        run: |
          godot --headless --path . -s res://tests/test_runner.gd 2>&1 | tee /tmp/testler.log
          echo "--- betik hatası kontrolü ---"
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/testler.log; then
            echo "::error::GDScript/parse hatası bulundu"
            exit 1
          fi

      - name: Android ARM64 APK dışa aktar (debug imza)
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" "build/android/${APK_NAME}" 2>&1 | tee /tmp/export.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/export.log; then
            echo "::error::Dışa aktarma sırasında betik hatası"
            exit 1
          fi

      - name: APK doğrulaması
        run: |
          test -s "build/android/${APK_NAME}"
          ls -la build/android/
          unzip -l "build/android/${APK_NAME}" | head -25
          unzip -l "build/android/${APK_NAME}" | grep -q "lib/arm64-v8a/libgodot_android.so" \
            && echo "APK içinde ARM64 godot kitaplığı doğrulandı"

      - name: APK artefaktını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/android/${{ env.APK_NAME }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: Sürüm yayını (yalnızca v* etiketlerinde)
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/android
      - name: GitHub Release oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/android/${APK_NAME}" \
            --title "Dragon Realms ${GITHUB_REF_NAME}" \
            --notes "Otomatik Android ARM64 derlemesi (Godot ${GODOT_VERSION}). Commit: ${GITHUB_SHA}"
